[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wx-clawbot"
version = "0.1.6"
description = "WeChat bridge for native Codex sessions in iTerm2"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = ["iterm2==2.30", "websockets==17.3", "segno==1.6.6", "cryptography==50.0.2", "Pillow==13.0.0", "markdown-it-py==4.2.0"]

[project.scripts]
wx-clawbot = "wx_clawbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
