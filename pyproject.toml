[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wx-clawbot"
version = "0.1.0.dev0"
description = "WeChat bridge for native Codex sessions in iTerm2"
requires-python = ">=3.14,<3.15"
dependencies = ["iterm2==2.30", "websockets==17.3", "segno==1.6.6"]

[project.scripts]
wx-clawbot = "wx_clawbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
